<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="script.js"></script>
  <!-- Add custom styles for flash message -->
  <style>
    .flash-message {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 1rem 1.5rem;
      border-radius: 0.5rem;
      z-index: 1000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .flash-message.error {
      background-color: #FEE2E2;
      color: #DC2626;
      border: 1px solid #DC2626;
    }
    .flash-message.success {
      background-color: #DCFCE7;
      color: #16A34A;
      border: 1px solid #16A34A;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-100 via-purple-50 to-pink-100 min-h-screen flex items-center justify-center p-4">
  <!-- Flash Message -->
  <div id="flashMessage" class="flash-message"></div>

  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-xl">
    <!-- Header -->
    <div class="text-center">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Welcome Back</h1>
      <p class="text-gray-500">Sign in to access your notes</p>
    </div>

    <!-- Sign In Form -->
    <form class="mt-8 space-y-6">
      <div class="space-y-4">
        <!-- Email Input -->
        <div>
          <label for="emailInput" class="block text-sm font-medium text-gray-700 mb-1">
            Email Address
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
              </svg>
            </div>
            <input 
              type="email" 
              id="emailInput" 
              class="appearance-none rounded-lg block w-full pl-10 pr-3 py-2 border border-gray-300 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="you@example.com"
              required
            >
          </div>
        </div>

        <!-- Password Input -->
        <div>
          <label for="passwordInput" class="block text-sm font-medium text-gray-700 mb-1">
            Password
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
              </svg>
            </div>
            <input 
              type="password" 
              id="passwordInput" 
              class="appearance-none rounded-lg block w-full pl-10 pr-3 py-2 border border-gray-300 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              placeholder="••••••••"
              required
            >
          </div>
        </div>
      </div>

      <!-- Sign In Button -->
      <div>
        <button 
          type="button"
          onclick="signIn()"
          class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transform transition-all duration-150 hover:scale-[1.02]"
        >
          <span class="absolute left-0 inset-y-0 flex items-center pl-3">
            <svg class="h-5 w-5 text-blue-300 group-hover:text-blue-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
            </svg>
          </span>
          Sign In
        </button>
      </div>
    </form>

    <!-- Guest Access -->
    <div class="relative">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-gray-300"></div>
      </div>
      <div class="relative flex justify-center text-sm">
        <span class="px-2 bg-white text-gray-500">Or continue with</span>
      </div>
    </div>

    <!-- Guest Button -->
    <div>
      <button 
        onclick="viewAsGuest()"
        class="w-full flex justify-center py-3 px-4 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
      >
        <svg class="w-5 h-5 mr-2 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
        </svg>
        Continue as Guest
      </button>
    </div>

    <!-- Sign Up Link -->
    <div class="text-center">
      <p class="text-sm text-gray-600">
        Don't have an account? 
        <a href="signup/signup.html" class="font-medium text-blue-600 hover:text-blue-500 transition-colors">
          Create Account
        </a>
      </p>
    </div>
  </div>

  <!-- Background Decoration -->
  <div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10">
    <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-br from-blue-500/10 via-purple-500/10 to-pink-500/10"></div>
    <div class="absolute bottom-0 right-0 w-full h-64 bg-gradient-to-tl from-blue-500/10 via-purple-500/10 to-pink-500/10"></div>
  </div>

  <script type="module">
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    const auth = getAuth();

    function showFlashMessage(message, isError = false) {
      const flashMessageDiv = document.getElementById('flashMessage');
      flashMessageDiv.textContent = message;
      flashMessageDiv.className = isError ? 'flash-message error' : 'flash-message success';
      flashMessageDiv.style.display = 'block';
      setTimeout(() => {
        flashMessageDiv.style.display = 'none';
      }, 3000);
    }

    function displayFlashMessageFromSession() {
      const message = sessionStorage.getItem('flashMessage');
      const messageType = sessionStorage.getItem('flashMessageType');
      if (message) {
        showFlashMessage(message, messageType === 'error');
        sessionStorage.removeItem('flashMessage');
        sessionStorage.removeItem('flashMessageType');
      }
    }

    window.signIn = function() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          window.location.href = "main/main.html";
        })
        .catch((error) => {
          const errorMessage = error.message;
          console.error("Error signing in:", errorMessage);
          showFlashMessage(`Error signing in: ${errorMessage}`, true);
        });
    };

    window.viewAsGuest = function() {
      const email = "public@gmail.com";
      const password = "123456";

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          window.location.href = "main/main.html";
        })
        .catch((error) => {
          const errorMessage = error.message;
          console.error("Error signing in as guest:", errorMessage);
          showFlashMessage(`Error signing in as guest: ${errorMessage}`, true);
        });
    };

    displayFlashMessageFromSession();
  </script>
</body>
</html>
