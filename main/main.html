<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Important Text</title>
  <link rel="stylesheet" href="main.css">
  <script type="module" src="main.js"></script>
</head>
<body>

  <div id="flashMessage" class="flash-message"></div>

  <h3 id="userEmail" class="welcome-message">Loading...</h3>

  <textarea id="userInput" placeholder="Enter text here"></textarea>
  <br><br><br>

  <button class="btn" onclick="signOutUser()">Log Out</button>
  <button class="btn" onclick="saveText()">Save Text</button>
  <button class="btn" onclick="document.getElementById('userInput').value = '';">Clear</button>
  <br><br><br>

  <div id="displayText"></div>

</body>
</html>
