<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Important Text</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="main.css">
  <script type="module" src="main.js"></script>

</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen flex flex-col">
  <!-- Flash Message -->
  <div id="flashMessage" class="flash-message"></div>

  <!-- Navigation Bar -->
  <nav class="bg-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2 sm:py-0">
      <div class="flex flex-col sm:flex-row justify-between items-center sm:h-16 gap-3 sm:gap-0">
        <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2 w-full sm:w-auto">
          <h1 class="text-lg sm:text-xl font-bold text-gray-800 sm:mr-4">Note Keeper</h1>
          
          <!-- Search Area -->
          <div class="flex items-center space-x-1 sm:space-x-2">
            <div class="relative flex items-center">
              <input type="text" id="searchInput" placeholder="Search..." oninput="handleSearch()" class="px-2 sm:px-3 py-1 pr-6 sm:pr-8 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 text-sm w-24 sm:w-auto">
              <button id="clearSearchBtn" onclick="clearSearch()" class="absolute right-2 text-gray-400 hover:text-gray-600 hidden" title="Clear search">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
            <select id="searchType" onchange="handleSearch()" class="px-1 sm:px-2 py-1 text-xs sm:text-sm border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 text-gray-700 w-24 sm:w-auto hidden">
              <option value="substring">Substr</option>
              <option value="fullword">Full Word</option>
              <option value="subsequence">Subseq</option>
              <option value="regex">Regex</option>
            </select>
            <div id="searchNavControls" class="flex items-center space-x-1 hidden">
              <button onclick="prevSearchResult()" class="px-1 py-1 text-gray-500 hover:text-gray-700 bg-gray-100 border border-gray-300 rounded" title="Previous result">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 sm:h-4 sm:w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
                </svg>
              </button>
              <span id="searchNavCount" class="text-[10px] sm:text-xs text-gray-500 px-1 text-center min-w-[20px] sm:min-w-[30px]">0/0</span>
              <button onclick="nextSearchResult()" class="px-1 py-1 text-gray-500 hover:text-gray-700 bg-gray-100 border border-gray-300 rounded" title="Next result">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 sm:h-4 sm:w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              </button>
            </div>
          </div>
          
          <!-- Settings / Gear Icon Menu -->
          <div class="relative ml-1 sm:ml-4">
            <button id="settingsMenuButton" onclick="toggleSettingsMenu()" class="p-1 sm:p-2 rounded-md text-gray-500 hover:text-gray-700 hover:bg-gray-100 focus:outline-none">
              <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
            <div id="settingsDropdown" class="hidden origin-top-right absolute left-0 mt-2 w-40 sm:w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-50">
              <div class="py-1" role="menu" aria-orientation="vertical" aria-labelledby="settingsMenuButton">
                <button onclick="expandAllNotes()" class="block w-full text-left px-4 py-2 text-xs sm:text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Expand All</button>
                <button onclick="collapseAllNotes()" class="block w-full text-left px-4 py-2 text-xs sm:text-sm text-gray-700 hover:bg-gray-100" role="menuitem">Collapse All</button>
              </div>
            </div>
          </div>
        </div>
        <div class="flex items-center space-x-2 sm:space-x-4 w-full sm:w-auto justify-between sm:justify-end border-t sm:border-t-0 border-gray-100 pt-2 sm:pt-0 mt-2 sm:mt-0">
          <span id="userEmail" class="text-xs sm:text-sm text-gray-600 truncate max-w-[150px] sm:max-w-xs">Loading...</span>
          <button 
            onclick="signOutUser()" 
            class="inline-flex items-center px-2 sm:px-3 py-1 sm:py-1.5 border border-transparent text-xs sm:text-sm font-medium rounded-md text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 whitespace-nowrap"
          >
            <svg class="w-3 h-3 sm:w-4 sm:h-4 mr-1 sm:mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            Log Out
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-grow">
    <div class="w-[95vw] mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="bg-white rounded-lg shadow-xl p-6">
        <!-- Text Input Area -->
        <div class="mb-6">
          <textarea 
            id="userInput" 
            oninput="handleSearch()"
            placeholder="Enter your notes here..." 
            class="w-full h-64 p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent font-mono shadow-sm"
            spellcheck="false"
          ></textarea>
        </div>

        <div id="replaceEditorGroup" class="mb-6 flex flex-col sm:flex-row gap-2 sm:items-center hidden">
          <label for="replaceInput" class="text-sm text-gray-700 whitespace-nowrap">Replace Found In Editor:</label>
          <input
            type="text"
            id="replaceInput"
            placeholder="Replacement text"
            class="flex-1 px-3 py-2 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          >
          <button
            onclick="replaceFoundInCurrentEditorNote()"
            class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
          >
            Replace Found
          </button>
        </div>

        <!-- Action Buttons -->
        <div class="flex space-x-4">
          <button 
            onclick="saveText()" 
            class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
          >
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
            </svg>
            Save Text
          </button>
          
          <button 
            onclick="document.getElementById('userInput').value = '';" 
            class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
          >
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            Clear
          </button>
        </div>
      </div>

      <!-- Saved Notes Display -->
      <div class="mt-8 bg-white rounded-lg shadow-xl p-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">
          Saved Notes <span id="searchResultsCount" class="text-sm font-normal text-gray-500 ml-2"></span>
        </h2>
        <div id="displayText" class="space-y-4">
          <!-- Saved notes will be displayed here with preserved formatting -->
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white mt-12">
    <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
      <p class="text-center text-gray-500 text-sm">
        © 2024 Note Keeper. All rights reserved.
      </p>
    </div>
  </footer>
</body>
</html>
